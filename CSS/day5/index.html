<!-- 
 Background Image, size, repeat, position, attachment

- Types Of Gradient : Linear, Radial, Conic

-Two class Property , Parent-child Property

- Ex : Create Parallax Scrolling Effect
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- internal css -->
    <style>
      .back-image {
        height: 400px;
        width: 400px;
        border: 1px solid black;
        background-image: url(./image.jpeg);
        background-repeat: no-repeat;
        /* background-position: top right; */
        background-attachment: fixed;
        /* background-attachment: scroll; */
      }
      .box {
        height: 600px;
        width: 200px;
        border: 1px solid black;
      }
      .gradient {
        height: 200px;
        width: 300px;
        border: 1px solid black;
        background: linear-gradient(red, green, white, blue);
        background: radial-gradient(red, green, white, blue);
        background: conic-gradient(red, green, white, blue);
        background: linear-gradient(
          270deg,
          hsla(247, 68%, 48%, 1) 0%,
          hsla(183, 71%, 50%, 1) 24%,
          hsla(117, 64%, 69%, 1) 47%,
          hsla(358, 57%, 51%, 1) 81%
        );
        background: radial-gradient(
          circle,
          rgba(63, 94, 251, 1) 0%,
          rgba(252, 70, 107, 1) 100%
        );
      }

      .parent {
        height: 300px;
        width: 400px;
        border: 1px solid black;
      }
      .child {
        height: 100px;
        width: 100px;
        border: 25px solid rgb(203, 34, 34);

        margin: auto;
        margin-top: 25px;
        box-shadow: 9px 16px 33px 9px rgba(226, 51, 51, 0.75);
      }
    </style>
  </head>
  <body>
    <h1>background properties</h1>

    <div class="back-image"></div>

    <div class="gradient"></div>

    <!-- <div class="box">extra div</div> -->

    <div class="parent">
      <div class="child">
        <img height="100%" width="100%" src="./image.jpeg" alt="" />
      </div>
    </div>
  </body>
</html>
