<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .main-container {
        height: 700px;
        background-color: yellow;
        display: flex;
      }
      .box {
        height: 150px;
        width: 300px;
        border: 1px solid black;
      }
      .box1 {
        background-color: aqua;
        /* flex-basis:30% ; */
      }
      .box2 {
        background-color: rgb(59, 206, 103);
        /* flex-grow: 3; */
        /* flex-shrink: 4; */
        /* align-self: center; */
      }
      .box3 {
        background-color: rgb(222, 103, 63);
        /* flex-grow: 5; */
        /* align-self: flex-end; */
        order: -2;
      }
      .box4 {
        /* flex-grow: 2; */
        /* flex-shrink:5 ; */
        order: -1;
        background-color: rgb(26, 24, 168);
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="box box1">box1</div>
      <div class="box box2">box2</div>
      <div class="box box3">box3</div>
      <div class="box box4">box4</div>
    </div>
  </body>
</html>
