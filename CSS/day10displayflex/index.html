 Display Flex (Parent Property)Display: FlexFlexDirection (Row, Row Reverse, Column, Column Reverse)Flex Wrap (Nowrap, Wrap, Wrap Reverse)Flex Flow (Flex Direction Flex Wrap) -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: borderbox;
      }
      .parent {
        height: 700px;
        display: flex;
        /* flex-direction: row-reverse;
        flex-direction: column-reverse; */
        background-color: yellow;
        /* flex-wrap: wrap; */

        flex-flow: row wrap ;
      }

      .box {
        height: 150px;
        width: 150px;
      }
      .box1 {
        background-color: blue;
      }
      .box2 {
        background-color: rgb(0, 255, 110);
      }
      .box3 {
        background-color: rgb(242, 255, 0);
      }
      .box4 {
        background-color: rgb(255, 157, 0);
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box box1">box1</div>
      <div class="box box2">box2</div>
      <div class="box box3">box3</div>
      <div class="box box4">box4</div>
      <div class="box box1">box1</div>
      <div class="box box2">box2</div>
      <div class="box box3">box3</div>
      <div class="box box4">box4</div>
      <div class="box box1">box1</div>
      <div class="box box2">box2</div>
      <div class="box box3">box3</div>
      <div class="box box4">box4</div>
      <div class="box box2">box2</div>
    </div>
    <img src="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Flexbox/flex_terms.png" alt="">
  </body>
</html>
